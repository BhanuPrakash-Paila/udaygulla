name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ug/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ug/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ug/server/package-lock.json
      - run: npm ci
      - run: npm run build
